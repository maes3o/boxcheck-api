<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BoxCheck — preflight PDF check</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --kraft:        #ddc9a3;
    --kraft-dark:   #c2a875;
    --kraft-line:   #a68f5f;
    --ink:          #23261f;
    --ink-soft:     #4b4c3f;
    --rust:         #b8501f;
    --rust-soft:    #e9c9b6;
    --pine:         #1f7a3d;
    --pine-soft:    #d7e1d0;
    --amber:        #9c6f18;
    --amber-soft:   #ecdcb5;
    --crit:         #a3241c;
    --crit-soft:    #e6c2bd;
    --info:         #3f5f75;
    --info-soft:    #d3dde3;
    --paper:        #f3ead6;
    --shadow:       rgba(35,38,31,0.18);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.10), transparent 55%),
      var(--kraft);
    background-attachment: fixed;
    color:var(--ink);
    font-family:'IBM Plex Mono', monospace;
    min-height:100vh;
    padding: 40px 18px 80px;
  }
  .sheet{
    max-width: 760px;
    margin: 0 auto;
    position: relative;
  }
  /* crop marks */
  .crop{ position:absolute; width:26px; height:26px; }
  .crop::before, .crop::after{ content:""; position:absolute; background:var(--ink); }
  .crop::before{ width:100%; height:2px; top:50%; }
  .crop::after{ height:100%; width:2px; left:50%; }
  .crop.tl{ top:-14px; left:-14px; }
  .crop.tr{ top:-14px; right:-14px; }
  .crop.bl{ bottom:-14px; left:-14px; }
  .crop.br{ bottom:-14px; right:-14px; }

  .langswitch{
    position:absolute;
    top:0; right:0;
    display:flex;
    border:1.5px solid var(--kraft-line);
    font-size:11px;
    letter-spacing:0.06em;
    user-select:none;
  }
  .langswitch button{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.06em;
    background:var(--kraft);
    color:var(--ink-soft);
    border:none;
    padding:6px 12px;
    cursor:pointer;
  }
  .langswitch button:first-child{ border-right:1.5px solid var(--kraft-line); }
  .langswitch button.active{ background:var(--ink); color:var(--paper); }

  header{
    text-align:center;
    padding: 10px 0 28px;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:0.14em;
    color:var(--ink-soft);
  }
  h1{
    margin: 6px 0 8px;
  }
  .logo-img{
    height:52px;
    width:auto;
    display:block;
    margin:0 auto;
  }
  .sub{
    font-size:13px;
    color:var(--ink-soft);
    max-width:480px;
    margin:0 auto;
    line-height:1.5;
  }

  .panel{
    background:var(--paper);
    border:1.5px solid var(--kraft-line);
    box-shadow: 0 10px 0 -6px var(--shadow), 0 2px 10px var(--shadow);
    padding: 26px;
    margin-bottom: 22px;
  }
  .panel h2{
    font-family:'Roboto Slab', serif;
    font-size:16px;
    margin:0 0 16px;
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .panel h2 .num{ color:var(--rust); }

  /* print method selector, looks like carton flap tabs */
  .methods{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .method{
    position:relative;
    text-align:center;
    padding:10px 6px;
    border:1.5px solid var(--kraft-line);
    background:var(--kraft);
    cursor:pointer;
    font-size:12.5px;
    color:var(--ink-soft);
    user-select:none;
    clip-path: polygon(8px 0, 100% 0, 100% 100%, 0 100%, 0 8px);
    transition: background .15s, color .15s, border-color .15s, box-shadow .15s;
  }
  .method-wrap{ flex:1 1 auto; }
  .method-hint{
    font-size:10.5px;
    color:var(--ink-soft);
    line-height:1.35;
    margin-top:6px;
    padding:0 2px;
  }
  .method:hover{ border-color:var(--rust); }
  .method.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--rust);
    font-weight:700;
    box-shadow: 0 0 0 2px var(--rust);
  }
  .method.active::after{
    content:"✓";
    position:absolute;
    top:2px; right:7px;
    font-size:11px;
    color:var(--rust-soft);
  }
  .method-unsure-hint{
    font-size:11px;
    color:var(--ink-soft);
    text-align:center;
    margin:2px 0 10px;
  }

  .drop{
    border: 2px dashed var(--kraft-line);
    background: repeating-linear-gradient(135deg, transparent, transparent 10px, rgba(166,143,95,0.06) 10px, rgba(166,143,95,0.06) 20px);
    padding: 36px 18px;
    text-align:center;
    cursor:pointer;
    transition: border-color .15s, background .15s;
  }
  .drop.drag{ border-color:var(--rust); background:var(--rust-soft); }
  .drop.hasfile{ border-style:solid; border-color:var(--pine); }
  .drop-icon{
    width:52px; height:52px; margin:0 auto 12px;
    display:block;
    color: var(--ink-soft);
  }
  .drop-title{ font-size:14px; color:var(--ink); margin-bottom:4px; font-weight:600; }
  .drop-sub{ font-size:11.5px; color:var(--ink-soft); }
  #fileInput{ display:none; }

  details.adv{ margin-top:18px; }
  details.adv summary{
    cursor:pointer;
    font-size:12px;
    color:var(--ink-soft);
    letter-spacing:0.04em;
  }
  .adv-grid{
    display:flex; gap:14px; flex-wrap:wrap;
    margin-top:14px;
  }
  .field{ flex:1 1 140px; }
  .field label{ display:block; font-size:11px; color:var(--ink-soft); margin-bottom:5px; }
  .field input, .field select{
    width:100%;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    padding:8px 9px;
    border:1.5px solid var(--kraft-line);
    background:var(--kraft);
    color:var(--ink);
  }

  .run-btn{
    margin-top:20px;
    width:100%;
    padding:14px;
    background:var(--rust);
    color:var(--paper);
    border:none;
    font-family:'Roboto Slab', serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.02em;
    cursor:pointer;
    transition: background .15s;
  }
  .run-btn:hover{ background:#9b3f16; }
  .run-btn:disabled{ background:var(--kraft-line); cursor:default; }

  .new-check-btn{
    margin-top:20px;
    width:100%;
    padding:12px;
    background:var(--kraft);
    color:var(--ink);
    border:1.5px solid var(--kraft-line);
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    cursor:pointer;
  }
  .new-check-btn:hover{ border-color:var(--rust); }

  .status{
    text-align:center;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:12px;
    min-height: 16px;
  }
  .status.err{ color:var(--rust); }

  /* results */
  .report-head{
    display:flex; justify-content:space-between; align-items:flex-end;
    border-bottom:2px solid var(--ink); padding-bottom:10px; margin-bottom:14px;
  }
  .report-head .fn{ font-size:14px; font-weight:600; word-break:break-all; }
  .report-head .meta{ font-size:11px; color:var(--ink-soft); text-align:right; }

  .row{
    display:flex; gap:14px; align-items:flex-start;
    padding:14px 10px;
    margin:0 -10px;
    border-bottom:1px solid var(--kraft-line);
  }
  .row:last-child{ border-bottom:none; }
  .row.warn{ background:rgba(184,80,31,0.08); }
  .row.crit{ background:rgba(163,36,28,0.10); }
  .stamp{
    flex:0 0 74px;
    text-align:center;
    font-family:'Roboto Slab', serif;
    font-weight:700;
    font-size:11.5px;
    letter-spacing:0.06em;
    padding:6px 4px;
    border:2px solid currentColor;
    transform:rotate(-3deg);
  }
  .stamp.pass{ color:var(--pine); }
  .stamp.warn{ color:var(--rust); }
  .stamp.crit{ color:var(--crit); }
  .stamp.info{ color:var(--info); }
  .row-body{ flex:1; }
  .row-title{ font-size:13.5px; font-weight:600; margin-bottom:3px; }
  .row-detail{ font-size:12px; color:var(--ink-soft); line-height:1.5; }
  .row-detail .val{ color:var(--ink); }
  .row-detail-line{ margin-bottom:2px; }

  .method-note{
    font-size:11px;
    color:var(--ink-soft);
    margin:-10px 0 16px;
    line-height:1.4;
  }
  .upload-limits{
    font-size:10.5px;
    color:var(--ink-soft);
    text-align:center;
    margin-top:8px;
  }
  .drop-file-actions{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:10px;
  }
  .drop-file-actions button{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    padding:7px 12px;
    border:1.5px solid var(--kraft-line);
    background:var(--kraft);
    color:var(--ink);
    cursor:pointer;
  }
  .drop-file-actions button:hover{ border-color:var(--rust); }
  .drop-file-actions button.danger{ color:var(--rust); }

  .summary-box{
    border:1.5px solid var(--kraft-line);
    background:var(--kraft);
    padding:16px;
    margin-bottom:22px;
  }
  .summary-message{
    font-size:13px;
    line-height:1.5;
    color:var(--ink);
    text-align:center;
    margin-bottom:14px;
  }
  .summary-stats{
    display:flex; flex-wrap:wrap; gap:10px;
    margin-bottom:14px;
  }
  .summary-stat{
    flex:1 1 auto;
    text-align:center;
    padding:8px 4px;
  }
  .summary-num{ display:block; font-family:'Roboto Slab', serif; font-weight:700; font-size:22px; }
  .summary-label{ display:block; font-size:10px; color:var(--ink-soft); margin-top:2px; line-height:1.3; }
  .summary-stat.crit .summary-num{ color:var(--crit); }
  .summary-stat.warn .summary-num{ color:var(--rust); }
  .summary-stat.info .summary-num{ color:var(--info); }
  .summary-stat.total .summary-num{ color:var(--ink); }
  .summary-status{
    text-align:center;
    font-family:'Roboto Slab', serif;
    font-weight:700;
    font-size:14px;
    padding:10px;
    border:1.5px solid currentColor;
  }
  .summary-status.status-ready{ color:var(--pine); }
  .summary-status.status-manual{ color:var(--rust); }
  .summary-status.status-critical{ color:var(--crit); }

  .quiz-link{
    display:block;
    background:none;
    border:none;
    padding:0;
    margin:-6px 0 14px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    text-decoration:underline;
    cursor:pointer;
  }
  .quiz-link:hover{ color:var(--rust); }
  .quiz-panel{
    background:var(--kraft);
    border:1.5px dashed var(--kraft-line);
    padding:18px;
    margin-bottom:18px;
  }
  .quiz-q{ margin-bottom:16px; }
  .quiz-q:last-child{ margin-bottom:0; }
  .quiz-q-title{ font-size:13px; font-weight:600; margin-bottom:10px; }
  .quiz-q-hint{ font-size:11px; color:var(--ink-soft); margin-bottom:10px; margin-top:-6px; }

  .thresholds-section{
    margin-top:18px;
    padding-top:18px;
    border-top:1.5px dashed var(--kraft-line);
    margin-bottom:18px;
  }
  #th-dpi-custom{ margin-top:8px; }
  .thresholds-summary{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:16px;
    padding-top:14px;
    border-top:1px solid var(--kraft-line);
  }
  .thresholds-intro-note{
    font-size:11px;
    color:var(--ink-soft);
    line-height:1.4;
    margin-bottom:6px;
  }
  .thresholds-toggle{
    display:block;
    background:none;
    border:none;
    padding:0;
    margin-bottom:14px;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    text-decoration:underline;
    cursor:pointer;
  }
  .thresholds-toggle:hover{ color:var(--rust); }
  .thresholds-actions{
    display:flex; flex-wrap:wrap; gap:10px;
    margin-top:14px;
  }
  .thresholds-actions button{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    padding:9px 14px;
    border:1.5px solid var(--kraft-line);
    background:var(--kraft);
    color:var(--ink);
    cursor:pointer;
  }
  .thresholds-actions button:hover{ border-color:var(--rust); }
  .thresholds-actions button.secondary{ color:var(--ink-soft); }
  .thresholds-note{
    font-size:11.5px;
    color:var(--pine);
    margin-top:10px;
    min-height:14px;
  }

  footer{
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    margin-top: 30px;
  }
  .footer-links{
    display:flex;
    justify-content:center;
    gap:16px;
    margin-bottom:12px;
  }
  .footer-link{
    background:none;
    border:none;
    padding:0;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    text-decoration:underline;
    cursor:pointer;
  }
  .footer-link:hover{ color:var(--rust); }
  .footer-panel{
    max-width:480px;
    margin:0 auto 14px;
    padding:14px;
    text-align:left;
    background:var(--kraft);
    border:1.5px dashed var(--kraft-line);
    font-size:11.5px;
    color:var(--ink-soft);
    line-height:1.5;
  }

  .feedback-fab{
    position:fixed;
    bottom:20px; right:20px;
    z-index:40;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.03em;
    padding:11px 18px;
    background:var(--rust);
    color:var(--paper);
    border:none;
    cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.25);
  }
  .feedback-fab:hover{ background:#9b3f16; }
  .feedback-panel{
    position:fixed;
    bottom:66px; right:20px;
    z-index:41;
    width:min(260px, calc(100vw - 40px));
    background:var(--paper);
    border:1.5px solid var(--ink);
    padding:16px;
    box-shadow:0 4px 16px rgba(0,0,0,.3);
  }
  .feedback-panel-title{ font-size:13px; font-weight:600; margin-bottom:10px; }
  .feedback-panel textarea{
    width:100%;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    padding:8px 9px;
    border:1.5px solid var(--kraft-line);
    background:var(--kraft);
    color:var(--ink);
    resize:vertical;
    margin-bottom:10px;
  }
  .feedback-actions{ display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
  .feedback-actions button{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    padding:9px 14px;
    border:1.5px solid var(--kraft-line);
    background:var(--kraft);
    color:var(--ink);
    cursor:pointer;
  }
  .feedback-actions button:hover{ border-color:var(--rust); }
  .feedback-actions button.secondary{ color:var(--ink-soft); }
  .feedback-success{
    text-align:center;
    font-family:'Roboto Slab', serif;
    font-weight:700;
    font-size:14px;
    color:var(--pine);
    padding:14px 0;
  }
  .feedback-note{ font-size:11.5px; color:var(--rust); margin-top:10px; min-height:14px; }

  @media (max-width:480px){
    .logo-img{ height:40px; }
    .panel{ padding:18px; }
    .langswitch{ position:static; display:inline-flex; margin-bottom:10px; }
  }
</style>
</head>
<body>

<div class="sheet">
  <div class="crop tl"></div><div class="crop tr"></div>
  <div class="crop bl"></div><div class="crop br"></div>

  <div class="langswitch" id="langswitch">
    <button data-lang="en">EN</button>
    <button data-lang="uk">UA</button>
  </div>

  <header>
    <div class="eyebrow" id="txt-eyebrow"></div>
    <h1><img src="/logo.svg" alt="BoxCheck" class="logo-img"></h1>
    <p class="sub" id="txt-sub"></p>
  </header>

  <div class="panel">
    <h2><span class="num">01</span> <span id="txt-h2-method"></span></h2>
    <div class="methods" id="methods">
      <div class="method-wrap">
        <div class="method" data-v="carton"></div>
        <div class="method-hint" data-v="carton"></div>
      </div>
      <div class="method-wrap">
        <div class="method" data-v="label"></div>
        <div class="method-hint" data-v="label"></div>
      </div>
      <div class="method-wrap">
        <div class="method" data-v="flexible"></div>
        <div class="method-hint" data-v="flexible"></div>
      </div>
      <div class="method-wrap">
        <div class="method" data-v="digital"></div>
        <div class="method-hint" data-v="digital"></div>
      </div>
      <div class="method-wrap">
        <div class="method active" data-v="unknown"></div>
      </div>
    </div>
    <div class="method-unsure-hint" id="txt-method-unsure-hint"></div>
    <div class="method-note" id="txt-method-note"></div>

    <button type="button" class="quiz-link" id="quizLink"></button>

    <div class="quiz-panel" id="quizPanel" hidden>
      <div class="quiz-q">
        <div class="quiz-q-title" id="txt-quiz-q2"></div>
        <div class="quiz-q-hint" id="txt-quiz-q2-hint"></div>
        <div class="adv-grid">
          <div class="field">
            <label id="txt-quiz-width-label"></label>
            <input type="number" id="quizWidth" step="1" min="0">
          </div>
          <div class="field">
            <label id="txt-quiz-height-label"></label>
            <input type="number" id="quizHeight" step="1" min="0">
          </div>
        </div>
      </div>
      <div class="quiz-q" id="quizCaliperQ" hidden>
        <div class="quiz-q-title" id="txt-quiz-caliper-title"></div>
        <div class="quiz-q-hint" id="txt-quiz-caliper-hint"></div>
        <div class="adv-grid">
          <div class="field">
            <label id="txt-quiz-caliper-label"></label>
            <input type="number" id="quizCaliper" step="0.1" min="0">
          </div>
        </div>
      </div>
    </div>

    <div class="thresholds-section">
      <div class="thresholds-intro-note" id="txt-thresholds-intro-note"></div>
      <button type="button" class="thresholds-toggle" id="thresholdsToggle"></button>
      <div class="thresholds-body" id="thresholdsBody" hidden>
        <div class="adv-grid">
          <div class="field">
            <label id="txt-th-bleed-label"></label>
            <input type="number" id="th-bleed" step="1">
          </div>
          <div class="field">
            <label id="txt-th-dpi-label"></label>
            <select id="th-dpi-select">
              <option value="72">72</option>
              <option value="150">150</option>
              <option value="300">300</option>
              <option value="other" id="opt-dpi-custom"></option>
            </select>
            <input type="number" id="th-dpi-custom" step="1" hidden>
          </div>
          <div class="field">
            <label id="txt-th-hairline-label"></label>
            <input type="number" id="th-hairline" step="0.05">
          </div>
        </div>
        <div class="thresholds-actions">
          <button id="saveThresholdsBtn"></button>
          <button class="secondary" id="resetThresholdsBtn"></button>
        </div>
        <div class="thresholds-note" id="thresholdsSaveNote"></div>
      </div>
    </div>

    <h2><span class="num">02</span> <span id="txt-h2-file"></span></h2>
    <div class="drop" id="drop">
      <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
        <path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
      </svg>
      <div class="drop-title" id="dropTitle"></div>
      <div class="drop-sub" id="dropSub"></div>
      <input type="file" id="fileInput" accept="application/pdf">
    </div>
    <div class="drop-file-actions" id="dropFileActions" hidden>
      <button type="button" id="replaceFileBtn"></button>
      <button type="button" class="danger" id="removeFileBtn"></button>
    </div>
    <div class="upload-limits" id="txt-upload-limits"></div>

    <button class="run-btn" id="runBtn" disabled></button>
    <div class="status" id="status"></div>
  </div>

  <div class="panel" id="resultsPanel" style="display:none;">
    <div class="report-head">
      <div class="fn" id="resFn"></div>
      <div class="meta" id="resMeta"></div>
    </div>
    <div class="summary-box" id="summaryBox"></div>
    <div id="resultsBody"></div>
    <div class="thresholds-summary" id="thresholdsSummary"></div>
    <button type="button" class="new-check-btn" id="newCheckBtn"></button>

    <button type="button" class="feedback-fab" id="feedbackFab"></button>
    <div class="feedback-panel" id="feedbackPanel" hidden>
      <div id="feedbackForm">
        <div class="feedback-panel-title" id="txt-feedback-title"></div>
        <textarea id="feedbackMessage" rows="4"></textarea>
        <div class="field">

// Server-side PROFILES defaults, fetched once and cached - the server is the
// single source of truth, no duplicated profile numbers here.
const profilesPromise = fetch(API_BASE.replace(/\/$/, '') + '/profiles')
  .then(r => r.json())
  .catch(() => null);

function thresholdsKey(method){ return 'boxcheck_thresholds_' + method; }

function loadStoredThresholds(method){
  try {
    const raw = localStorage.getItem(thresholdsKey(method));
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(typeof parsed.bleed_mm !== 'number' || typeof parsed.dpi_threshold !== 'number' || typeof parsed.hairline_mm !== 'number'){
      return null;
    }
    return parsed;
  } catch(e) { return null; }
}

const DPI_PRESETS = ['72', '150', '300'];

function getDpiValue(){
  const sel = document.getElementById('th-dpi-select').value;
  if(sel === 'other') return parseInt(document.getElementById('th-dpi-custom').value, 10);
  return parseInt(sel, 10);
}

function setDpiValue(value){
  const selEl = document.getElementById('th-dpi-select');
  const customEl = document.getElementById('th-dpi-custom');
  if(DPI_PRESETS.includes(String(value))){
    selEl.value = String(value);
    customEl.hidden = true;
    customEl.value = '';
  } else {
    selEl.value = 'other';
    customEl.hidden = false;
    customEl.value = value;
  }
}

document.getElementById('th-dpi-select').addEventListener('change', () => {
  const customEl = document.getElementById('th-dpi-custom');
  if(document.getElementById('th-dpi-select').value === 'other'){
    customEl.hidden = false;
    customEl.focus();
  } else {
    customEl.hidden = true;
  }
});

// Populate the "My settings" fields for a given print method: saved
// localStorage values take priority, otherwise the server's profile default.
async function populateSettingsFields(method){
  document.getElementById('thresholdsSaveNote').textContent = '';
  document.getElementById('saveThresholdsBtn').textContent =
    t().save_thresholds_btn(t().profiles[method] || method);

  let values = loadStoredThresholds(method);
  if(!values){
    const profiles = await profilesPromise;
    values = profiles && (profiles[method] || profiles.unknown);
  }
  if(!values) return;
  document.getElementById('th-bleed').value = values.bleed_mm;
  setDpiValue(values.dpi_threshold);
  document.getElementById('th-hairline').value = values.hairline_mm;
}

function clearFile(){
  selectedFile = null;
  fileInput.value = '';
  drop.classList.remove('hasfile');
  dropTitle.textContent = t().drop_title_empty;
  dropSub.textContent = t().drop_sub_empty;
  dropFileActions.hidden = true;
  runBtn.disabled = true;
  statusEl.textContent = '';
  statusEl.classList.remove('err');
  document.getElementById('resultsPanel').style.display = 'none';
  lastResultData = null;
}

['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, (e) => {
  e.preventDefault(); drop.classList.add('drag');
}));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, (e) => {
  e.preventDefault(); drop.classList.remove('drag');
}));
drop.addEventListener('drop', (e) => {
  const f = e.dataTransfer.files[0];
  if(f) setFile(f);
});

function setFile(f){
  if(f.type !== 'application/pdf' && !f.name.toLowerCase().endsWith('.pdf')){
    statusEl.textContent = t().err_pdf_only;
    statusEl.classList.add('err');
    return;
  }
  if(f.size > MAX_FILE_SIZE_MB * 1024 * 1024){
    statusEl.textContent = t().err_file_too_large((f.size/1024/1024).toFixed(1), MAX_FILE_SIZE_MB);
    statusEl.classList.add('err');
    return;
  }
  selectedFile = f;
  drop.classList.add('hasfile');
  dropTitle.textContent = f.name;
  dropSub.textContent = t().drop_sub_ready((f.size/1024/1024).toFixed(2));
  dropFileActions.hidden = false;
  runBtn.disabled = false;
  statusEl.textContent = '';
  statusEl.classList.remove('err');
  document.getElementById('resultsPanel').style.display = 'none';
  lastResultData = null;
}

runBtn.addEventListener('click', async () => {
  if(!selectedFile) return;
  runBtn.disabled = true;
  runBtn.dataset.busy = '1';
  runBtn.textContent = t().run_btn_busy;
  statusEl.classList.remove('err');
  statusEl.textContent = t().status_uploading;

  try{
    const url = new URL(API_BASE.replace(/\/$/, '') + '/check');
    url.searchParams.set('print_method', printMethod);
    url.searchParams.set('unit', 'mm');
    url.searchParams.set('bleed_threshold', document.getElementById('th-bleed').value);
    url.searchParams.set('dpi_threshold', getDpiValue());
    url.searchParams.set('hairline_threshold', document.getElementById('th-hairline').value);

    const form = new FormData();
    form.append('file', selectedFile);

    const resp = await fetch(url.toString(), { method:'POST', body: form });
    if(!resp.ok){
      const txt = await resp.text();
      let msg = txt.slice(0, 200);
      try {
        const parsed = JSON.parse(txt);
        const detail = parsed.detail;
        if(detail && typeof detail === 'object' && detail.code && t().errcode[detail.code]){
          msg = t().errcode[detail.code](detail.max_mb ?? detail.timeout_s);
        } else if(detail && typeof detail === 'object' && detail.message){
          msg = detail.message;
        } else if(typeof detail === 'string'){
          msg = detail;
        } else if(parsed.error){
          msg = parsed.error;
        }
      } catch(e) {}
      throw new Error(msg);
    }
    const data = await resp.json();
    lastResultData = data;
    renderResults(data);
    statusEl.textContent = t().status_done;
  } catch(err){
    statusEl.textContent = t().status_error + err.message;
    statusEl.classList.add('err');
  } finally {
    runBtn.disabled = false;
    runBtn.dataset.busy = '0';
    runBtn.textContent = t().run_btn;
  }
});

function stamp(severity){
  const cls = { ok: 'pass', warning: 'warn', critical: 'crit', info: 'info' }[severity] || 'pass';
  const label = { ok: t().stamp_ok, warning: t().stamp_warn, critical: t().stamp_crit, info: t().stamp_info }[severity] || t().stamp_ok;
  return `<div class="stamp ${cls}">${label}</div>`;
}

function rowClass(severity){
  if(severity === 'critical') return 'row crit';
  if(severity === 'warning') return 'row warn';
  return 'row';
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderResults(d){
  const meta = d.thresholds_used;
  const profileLabel = t().profiles[d.print_method] || t().profiles.unknown;
  const headerMethodLabel = d.print_method === 'unknown' ? t().print_method_not_specified : profileLabel;
  document.getElementById('resFn').textContent = d.filename || '';
  document.getElementById('resMeta').textContent = t().res_meta(headerMethodLabel, d.page_count);

  const rows = [];
  const addRow = (severity, title, detailHtml) => {
    rows.push({ severity, html: `
      <div class="${rowClass(severity)}">
        ${stamp(severity)}
        <div class="row-body">
          <div class="row-title">${title}</div>
          <div class="row-detail">${detailHtml}</div>
        </div>
      </div>` });
  };

  // Bleed - critical only for a confirmed insufficient bleed (TrimBox is
  // explicitly set and the actual bleed is below the profile threshold).
  // A missing TrimBox is just insufficient data, not a confirmed problem,
  // so it's a warning regardless of manual size. A detected dieline makes
  // the rectangular check meaningless, so it's skipped entirely in favor
  // of a single info note.
  if(hasDielineHints(d)){
    addRow('info', t().bleed_title, t().bleed_dieline_note);
  } else {
    const severity = bleedSeverity(d);
    const detail = `
      <div class="row-detail-line">${t().bleed_expected(meta.bleed_mm)}</div>
      <div class="row-detail-line">${t().bleed_detected(d.bleed_mm)}</div>
      ${!d.has_bleed ? `<div class="row-detail-line">${t().bleed_no_box}</div>` : ''}`;
    addRow(severity, t().bleed_title, detail);
  }

  // Images: RGB (most print shops require CMYK/spot, so a hit here means
  // rework before print - same level as low DPI or unembedded fonts) + DPI
  {
    const imgs = d.images || [];
    const rgbBad = imgs.filter(i => i.rgb_warning);
    const loresBad = imgs.filter(i => i.low_res_warning);
    if(imgs.length === 0){
      addRow('ok', t().images_title, t().images_none);
    } else {
      addRow(
        rgbSeverity(imgs),
        t().rgb_title,
        rgbBad.length === 0 ? t().rgb_ok(imgs.length) : t().rgb_bad(rgbBad.length, imgs.length)
      );
      addRow(
        loresBad.length === 0 ? 'ok' : 'warning',
        t().dpi_title,
        loresBad.length === 0
          ? t().dpi_ok(meta.dpi_threshold)
          : t().dpi_bad(loresBad.length, imgs.length, meta.dpi_threshold, loresBad.map(i => (i.dpi ?? '?') + ' dpi').join(', '))
      );
    }
  }

  // Hairlines
  {
    const ok = !d.hairline_warning;
    addRow(ok ? 'ok' : 'warning', t().hairline_title,
      ok ? t().hairline_ok : t().hairline_bad(d.thin_lines_count, profileLabel));
  }

  // Fonts
  {
    const ok = !d.unembedded_fonts_warning;
    const unembedded = (d.fonts || []).filter(f => !f.embedded).map(f => f.name);
    addRow(ok ? 'ok' : 'warning', t().fonts_title,
      ok ? t().fonts_ok : t().fonts_bad(unembedded.join(', ')));
  }

  // Overprint
  {
    const ok = !d.overprint_white_warning;
    const lines = [`<div class="row-detail-line">${ok ? t().overprint_ok : t().overprint_bad}</div>`];
    if(d.overprint_black_count > 0){
      lines.push(`<div class="row-detail-line">${t().overprint_black_note(d.overprint_black_count)}</div>`);
    }
    if(d.overprint_other_count > 0){
      lines.push(`<div class="row-detail-line">${t().overprint_other_note(d.overprint_other_count)}</div>`);
    }
    addRow(ok ? 'ok' : 'warning', t().overprint_title, lines.join(''));
  }

  // Trim marks - "not found" is informational (depends entirely on the print
  // shop's own requirements), never a red/orange warning.
  {
    const found = !d.trim_marks_warning;
    addRow(found ? 'ok' : 'info', t().trim_marks_title, found ? t().trim_marks_ok : t().trim_marks_bad);
  }

  // Page size consistency
  if(d.page_count > 1){
    const ok = !d.page_size_consistency_warning;
    const pages = (d.inconsistent_pages || []).join(', ');
    addRow(ok ? 'ok' : 'warning', t().page_size_title,
      ok ? t().page_size_ok : t().page_size_bad(d.inconsistent_page_count, pages));
  }

  // Spot colors: a plain list is informational, a name reused with different
  // values is an actionable warning.
  {
    const spots = d.spot_colors || [];
    let severity, detail;
    if(spots.length === 0){
      severity = 'ok';
      detail = t().spot_colors_none;
    } else if(d.spot_colors_conflict_warning){
      severity = 'warning';
      const list = spots.map(sc => escapeHtml(sc.name) + (sc.duplicate_conflict ? ' ⚠' : '')).join(', ');
      detail = t().spot_colors_list(list) + t().spot_colors_conflict_note;
    } else {
      severity = 'info';
      detail = t().spot_colors_list(spots.map(sc => escapeHtml(sc.name)).join(', '));
    }
    addRow(severity, t().spot_colors_title, detail);
  }

  // PDF/X compliance: not declared = informational (most files aren't, and
  // that's fine); declared-but-broken is an actionable warning.
  {
    const pdfx = d.pdfx_compliance || {};
    let severity, detail;
    if(!pdfx.is_pdfx){
      severity = 'info';
      detail = t().pdfx_not_declared;
    } else if(pdfx.has_output_intent && pdfx.has_icc_profile){
      severity = 'ok';
      detail = t().pdfx_declared_ok(pdfx.version);
    } else if(pdfx.has_output_intent){
      severity = 'warning';
      detail = t().pdfx_declared_no_icc(pdfx.version);
    } else {
      severity = 'warning';
      detail = t().pdfx_declared_no_oi(pdfx.version);
    }
    addRow(severity, t().pdfx_title, detail);
  }

  // Declared size (only shown if the user filled in the optional quiz field)
  {
    const declaredW = parseFloat(document.getElementById('quizWidth').value);
    const declaredH = parseFloat(document.getElementById('quizHeight').value);
    if(!isNaN(declaredW) && !isNaN(declaredH) && declaredW > 0 && declaredH > 0 && d.trimbox){
      const tb = d.trimbox;
      const actualW = Math.round(((tb[2] - tb[0]) * 25.4 / 72) * 10) / 10;
      const actualH = Math.round(((tb[3] - tb[1]) * 25.4 / 72) * 10) / 10;
      const tol = 2;
      const direct = Math.abs(actualW - declaredW) <= tol && Math.abs(actualH - declaredH) <= tol;
      const swapped = Math.abs(actualW - declaredH) <= tol && Math.abs(actualH - declaredW) <= tol;
      const ok = direct || swapped;
      addRow(ok ? 'ok' : 'warning', t().declared_size_title,
        ok ? t().declared_size_match(declaredW, declaredH, actualW, actualH)
           : t().declared_size_mismatch(declaredW, declaredH, actualW, actualH));
    }
  }

  // Caliper-based recommendation (carton only, purely informational, user input only)
  {
    const caliper = parseFloat(document.getElementById('quizCaliper').value);
    if(d.print_method === 'carton' && !isNaN(caliper) && caliper > 0){
      const { flapLow, flapHigh, creaseMin } = caliperRecommendation(caliper);
      let text = t().caliper_recommendation_text(caliper, flapLow, flapHigh, creaseMin);
      if(caliper >= 1.0) text += ' ' + t().caliper_recommendation_thick_note;
      addRow('info', t().caliper_recommendation_title, text);
    }
  }

  // Dieline line-name hints (best-effort, informational only - omitted entirely when nothing found)
  {
    const hints = d.dieline_hints || [];
    if(hints.length > 0){
      const catLabel = (cat) => t()['dieline_cat_' + cat] || cat;
      const list = hints.map(h => `${catLabel(h.category)}: ${h.names.map(escapeHtml).join(', ')}`).join(' · ');
      addRow('info', t().dieline_title, t().dieline_intro(list));
    }
  }

  // Summary box: tally severities across every row actually shown.
  const counts = { critical: 0, warning: 0, info: 0, ok: 0 };
  rows.forEach(r => { counts[r.severity] = (counts[r.severity] || 0) + 1; });
  const total = rows.length;
  const statusKey = summaryStatusKey(counts);
  const statusClass = { critical: 'status-critical', manual: 'status-manual', ready: 'status-ready' }[statusKey];
  const statusText = {
    critical: t().summary_status_critical,
    manual: t().summary_status_manual,
    ready: t().summary_status_ready,
  }[statusKey];
  const summaryMessage = {
    critical: t().summary_message_critical,
    manual: t().summary_message_manual(counts.warning),
    ready: t().summary_message_ready,
  }[statusKey];
  document.getElementById('summaryBox').innerHTML = `
    <div class="summary-message">${summaryMessage}</div>
    <div class="summary-stats">
      <div class="summary-stat crit"><span class="summary-num">${counts.critical}</span><span class="summary-label">${t().summary_critical}</span></div>
      <div class="summary-stat warn"><span class="summary-num">${counts.warning}</span><span class="summary-label">${t().summary_warning}</span></div>
      <div class="summary-stat info"><span class="summary-num">${counts.info}</span><span class="summary-label">${t().summary_info}</span></div>
      <div class="summary-stat total"><span class="summary-num">${total}</span><span class="summary-label">${t().summary_checked}</span></div>
    </div>
    <div class="summary-status ${statusClass}">${statusText}</div>`;

  document.getElementById('resultsBody').innerHTML = rows.map(r => r.html).join('');
  document.getElementById('resultsPanel').style.display = 'block';

  document.getElementById('thresholdsSummary').textContent =
    t().thresholds_summary(meta.bleed_mm, meta.dpi_threshold, meta.hairline_mm);
}

document.getElementById('saveThresholdsBtn').addEventListener('click', () => {
  const method = printMethod;
  const bleed = parseFloat(document.getElementById('th-bleed').value);
  const dpi = getDpiValue();
  const hairline = parseFloat(document.getElementById('th-hairline').value);
  if(isNaN(bleed) || isNaN(dpi) || isNaN(hairline)) return;
  try {
    localStorage.setItem(thresholdsKey(method), JSON.stringify({
      bleed_mm: bleed, dpi_threshold: dpi, hairline_mm: hairline,
    }));
  } catch(e) {}
  document.getElementById('thresholdsSaveNote').textContent =
    t().thresholds_saved_note(t().profiles[method] || method);
});

document.getElementById('resetThresholdsBtn').addEventListener('click', async () => {
  const method = printMethod;
  try { localStorage.removeItem(thresholdsKey(method)); } catch(e) {}
  const profiles = await profilesPromise;
  const defaults = profiles && (profiles[method] || profiles.unknown);
  if(!defaults) return;
  document.getElementById('th-bleed').value = defaults.bleed_mm;
  setDpiValue(defaults.dpi_threshold);
  document.getElementById('th-hairline').value = defaults.hairline_mm;
  document.getElementById('thresholdsSaveNote').textContent = t().thresholds_reset_note;
});

applyStaticText();
populateSettingsFields(printMethod);
</script>

</body>
</html>
